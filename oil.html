<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1116" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bowling" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <title>Oil / Pattern</title>
  <link rel="stylesheet" href="styles.css?v=129" />
</head>
<body data-page="oil">
  <div class="navlinks"></div>
  <div class="container">
    <div class="header">
      <h1>Oil &amp; houses</h1>
      <div class="small">Saved on this phone. Game Day, the Game Plan and Coach use these.</div>
    </div>
    <div class="ar-hub" id="oilHub"></div>
    <div class="ar-nav" id="oilNav" style="display:none"></div>

    <div class="panel" data-secpage="pattern">
      <h2 style="margin:0 0 8px" id="pFormTitle">✏️ Add an oil pattern</h2>
      <div class="grid-2">
        <div>
          <label>Pattern Name</label>
          <input class="input" id="pName" placeholder="e.g., House Shot / Shark" />
        </div>
        <div>
          <label>Center / Location (optional)</label>
          <input class="input" id="pCenter" placeholder="e.g., Imperial Lanes" />
        </div>
        <div>
          <label>Pattern Length (ft)</label>
          <select class="input" id="pLen"><option value="">Pick a length</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option></select>
        </div>
        <div>
          <label>Oil Volume (mL)</label>
          <input class="input" id="pVol" type="number" step="0.1" placeholder="e.g., 24.5" />
        </div>
        <div>
          <label>Ratio</label>
          <input class="input" id="pRatio" placeholder="e.g., 8:1" />
        </div>
        <div>
          <label>Surface Notes</label>
          <input class="input" id="pNotes" placeholder="e.g., crisp backends, tight middle" />
        </div>
      </div>

      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn" id="save">Save pattern</button>
        <button class="btn secondary" id="clear">Clear form</button>
        <div class="small" id="status"></div>
      </div>
    </div>

    <div class="panel" data-secpage="saved">
      <h2>📚 Saved patterns</h2>
      <div class="list" id="patterns"></div>
    </div>

    <div class="panel" data-secpage="houses">
      <h2>🏠 Houses</h2>
      <div class="small">Your houses are the House list in Game Day, the Game Plan and Arsenal.</div>
      <div class="hr-split"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input class="input" id="houseName" placeholder="Add a bowling center" style="max-width:320px" />
        <button class="btn" id="addHouse">Add</button>
      </div>
      <div style="margin-top:10px" class="list" id="houses"></div>
    </div>
  </div>

  <script src="app.js?v=129"></script>
  <script src="pinpal.js?v=129"></script>
  <script src="history.js?v=129"></script>
  <script>
    BT.renderNav('oil');

    const el = {
      pName: BT.$('#pName'),
      pCenter: BT.$('#pCenter'),
      pLen: BT.$('#pLen'),
      pVol: BT.$('#pVol'),
      pRatio: BT.$('#pRatio'),
      pNotes: BT.$('#pNotes'),
      status: BT.$('#status'),
      patterns: BT.$('#patterns'),
      houseName: BT.$('#houseName'),
      houses: BT.$('#houses'),
    };

    function renderPatterns() {
      const patterns = BT.lsGet(BT.KEYS.OIL_PATTERNS, []);
      el.patterns.innerHTML = patterns.map(p => {
        const when = new Date(p.savedAt || Date.now()).toLocaleString();
        const summary = `${p.name} • ${p.length || '?'}ft • ${p.volume || '?'}mL • ${p.ratio || '?'} • ${p.center || ''}`;
        return `<div class="list-item">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
            <div>
              <div style="font-weight:800">${p.name}</div>
              <div class="small">${summary}</div>
              <div class="small">Saved ${when}</div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <button class="btn secondary" data-load="${p.id}">Load</button>
              <button class="btn danger" data-del="${p.id}" style="min-width:110px">Remove</button>
            </div>
          </div>
        </div>`;
      }).join('') || `<div class="list-item small">No patterns saved yet.</div>`;

      BT.$all('button[data-load]', el.patterns).forEach(b => {
        b.addEventListener('click', () => {
          const id = b.getAttribute('data-load');
          const patterns = BT.lsGet(BT.KEYS.OIL_PATTERNS, []);
          const p = patterns.find(x => x.id === id);
          if (!p) return;
          el.pName.value = p.name || '';
          el.pCenter.value = p.center || '';
          { const t = p.length == null ? '' : String(p.length); if (t && ![...el.pLen.options].some(o => o.value === t)) el.pLen.add(new Option(t, t)); el.pLen.value = t; }
          el.pVol.value = p.volume ?? '';
          el.pRatio.value = p.ratio || '';
          el.pNotes.value = p.notes || '';
          el.status.textContent = 'Loaded. Change anything and tap Save pattern.';
          const ft = BT.$('#pFormTitle'); if (ft) ft.textContent = '✏️ Edit: ' + (p.name || 'pattern');
          if (window.__oilSec) __oilSec.go('pattern');
        });
      });

      BT.$all('button[data-del]', el.patterns).forEach(b => {
        b.addEventListener('click', () => {
          const id = b.getAttribute('data-del');
          if (!confirm('Remove this pattern?')) return;
          const patterns = BT.lsGet(BT.KEYS.OIL_PATTERNS, []).filter(x => x.id !== id);
          BT.lsSet(BT.KEYS.OIL_PATTERNS, patterns);
          renderPatterns();
        });
      });
    }

    // 🏠 One list: your houses plus every house in your PinPal history (games, last bowled). Add or remove each.
    let renderHouses = function () {
      const hs = BT.lsGet(BT.KEYS.HOUSES, []) || [];
      const H = window.BTHistory, h = H && H.has && H.has() ? H.load() : null;
      const by = {}; if (h) (h.games || []).forEach(g => { if (!g.h) return; const o = by[g.h] = by[g.h] || { n: 0, last: '' }; o.n++; if (g.d > o.last) o.last = g.d; });
      const key = (t) => String(t || '').toLowerCase();
      const inList = (n) => hs.some(x => key(x) === key(n));
      const names = [...hs, ...Object.keys(by).filter(n => !inList(n))];
      const stat = (n) => by[Object.keys(by).find(k => key(k) === key(n))] || null;
      names.sort((x, y) => (inList(y) - inList(x)) || String((stat(y) || {}).last || '').localeCompare(String((stat(x) || {}).last || '')));
      const fmt = (d) => { if (!d) return ''; const [yy, m] = d.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m) - 1] + ' ' + yy; };
      const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const notYet = names.filter(n => !inList(n));
      el.houses.innerHTML = (h ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px"><span class="small dim">${hs.length} in your list · ${Object.keys(by).length} in your PinPal history</span>${notYet.length ? `<button class="btn secondary" id="ppAddAll" type="button">Add all (${notYet.length})</button>` : ''}</div>` : '<div class="small dim" style="margin-bottom:6px">Import your PinPal backup (Scores → History) to list every house you\'ve bowled.</div>')
        + (names.map(n => { const st = stat(n), mine = inList(n);
          return `<div class="list-item" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>${esc(n)}</b>${mine ? ' <span class="small" style="color:var(--accent);font-weight:800">✓</span>' : ''}<div class="small dim">${st ? `${st.n} PinPal game${st.n === 1 ? '' : 's'} · last ${fmt(st.last)}` : 'Not in your PinPal history'}</div></div>
            ${mine ? `<button class="btn danger" data-hdel="${esc(n)}" style="min-width:96px">Remove</button>` : `<button class="btn" data-hadd="${esc(n)}" style="min-width:96px">+ Add</button>`}</div>`; }).join('') || '<div class="list-item small">No houses yet. Add one above.</div>');
      BT.$all('button[data-hdel]', el.houses).forEach(b => b.addEventListener('click', () => { const n = b.getAttribute('data-hdel'); BT.lsSet(BT.KEYS.HOUSES, (BT.lsGet(BT.KEYS.HOUSES, []) || []).filter(x => key(x) !== key(n))); renderHouses(); }));
      const add = (L) => { const cur = BT.lsGet(BT.KEYS.HOUSES, []) || []; L.forEach(n => { if (!cur.some(x => key(x) === key(n))) cur.push(n); }); BT.lsSet(BT.KEYS.HOUSES, cur); renderHouses(); };
      BT.$all('button[data-hadd]', el.houses).forEach(b => b.addEventListener('click', () => add([b.getAttribute('data-hadd')])));
      const all = BT.$('#ppAddAll'); if (all) all.addEventListener('click', () => add(notYet));
    };

    function save() {
      const name = el.pName.value.trim();
      if (!name) return alert('Pattern name is required.');
      const patterns = BT.lsGet(BT.KEYS.OIL_PATTERNS, []);
      const existing = patterns.find(p => p.name.toLowerCase() === name.toLowerCase());
      const payload = {
        id: existing ? existing.id : `pat_${Math.random().toString(36).slice(2,10)}`,
        name,
        center: el.pCenter.value.trim(),
        length: el.pLen.value ? Number(el.pLen.value) : null,
        volume: el.pVol.value ? Number(el.pVol.value) : null,
        ratio: el.pRatio.value.trim(),
        notes: el.pNotes.value.trim(),
        savedAt: Date.now(),
      };
      const next = existing ? patterns.map(p => p.id === payload.id ? payload : p) : [payload, ...patterns];
      BT.lsSet(BT.KEYS.OIL_PATTERNS, next);
      el.status.innerHTML = 'Saved. <a href="#saved">See saved patterns →</a>';
      renderPatterns();
    }

    BT.$('#save').addEventListener('click', save);
    BT.$('#clear').addEventListener('click', () => {
      el.pName.value = '';
      el.pCenter.value = '';
      el.pLen.value = '';
      el.pVol.value = '';
      el.pRatio.value = '';
      el.pNotes.value = '';
      el.status.textContent = '';
      const ft = BT.$('#pFormTitle'); if (ft) ft.textContent = '✏️ Add an oil pattern';
    });

    BT.$('#addHouse').addEventListener('click', () => {
      const name = el.houseName.value.trim();
      if (!name) return;
      const houses = BT.lsGet(BT.KEYS.HOUSES, []);
      if (!houses.some(h => h.toLowerCase() === name.toLowerCase())) houses.unshift(name);
      BT.lsSet(BT.KEYS.HOUSES, houses);
      el.houseName.value = '';
      renderHouses();
    });

    renderPatterns();
    renderHouses();

    // 🗂️ Oil section: menu first, then one page at a time with a tile bar.
    window.__oilSec = BT.sectionPages({
      hub: BT.$('#oilHub'), nav: BT.$('#oilNav'), homeLabel: 'Oil & houses', cols: 3,
      pages: [
        { id: 'pattern', icon: '✏️', t: 'Add an oil pattern', s: 'Add pattern', d: 'Length, volume, ratio and notes' },
        { id: 'saved', icon: '📚', t: 'Saved patterns', d: 'Load, edit or remove a pattern' },
        { id: 'houses', icon: '🏠', t: 'Houses', d: 'Your houses, plus every house in your PinPal history' },
      ],
      onShow: (id, hub) => {
        const pats = (BT.lsGet(BT.KEYS.OIL_PATTERNS, []) || []).length, hs = (BT.lsGet(BT.KEYS.HOUSES, []) || []).length;
        const sp = hub.querySelector('[data-hubd="saved"]'); if (sp) sp.textContent = `${pats} saved · load, edit or remove a pattern`;
        const sh = hub.querySelector('[data-hubd="houses"]'); if (sh) sh.textContent = `${hs} in your list · plus every house in your PinPal history`;
        const sub = hub.querySelector('[data-hubsub]'); if (sub) sub.textContent = 'Pick what you want to do:';
      },
    });
  </script>
</body>
</html>
